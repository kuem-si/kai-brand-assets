<!-- KAI email signature, identity-v1.0.0. Replace the {{PLACEHOLDERS}}; host email-signature-logo@2x.png on your own HTTPS server and put its URL in {{LOGO_URL}}.
     Keep the logo at the given width; do not recolour it. Uses web-safe fallbacks because most mail clients ignore web fonts. -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif;color:#151A1E">
  <tr><td style="padding:0 0 4px 0;font-size:14px;line-height:20px;font-weight:600">{{NAME}}</td></tr>
  <tr><td style="padding:0 0 12px 0;font-size:13px;line-height:18px;color:#5D646A">{{ROLE}}</td></tr>
  <tr><td style="padding:0 0 12px 0"><img src="{{LOGO_URL}}" width="119" height="44" alt="KAI by KUEM" style="display:block;border:0;width:119px;height:44px"></td></tr>
  <tr><td style="font-size:13px;line-height:18px;color:#5D646A">{{PHONE}} &middot; <a href="mailto:{{EMAIL}}" style="color:#004869;text-decoration:none">{{EMAIL}}</a></td></tr>
</table>
